services:
  bm2q:
    build: .
    image: bm2q
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # - LOG_LEVEL=debug
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s
      retries: 3
