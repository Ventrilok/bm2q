services:
  backend:
    build: .
    command: ["npx", "tsx", "src/server/index.ts"]
    ports:
      - "2567:2567"
    environment:
      - NODE_ENV=production
      - COLYSEUS_PORT=2567
    networks:
      - app-network

  frontend:
    build: .
    command: ["npm", "run", "start"]
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
