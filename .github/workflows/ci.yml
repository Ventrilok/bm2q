name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, tests, build, smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the production server (site + game on one port)
        run: |
          PORT=3000 NODE_ENV=production node dist/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:3000/ > /dev/null && break; sleep 1; done
          SMOKE_URL=http://localhost:3000 npm run test:smoke
      - if: failure()
        run: cat server.log || true

  docker:
    name: Docker image builds and serves the game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker build -t bm2q:ci .
      - name: Run the image and smoke test it
        run: |
          docker run -d --name bm2q -p 3000:3000 bm2q:ci
          for i in $(seq 1 30); do curl -fs http://localhost:3000/healthz > /dev/null && break; sleep 1; done
          curl -fsS http://localhost:3000/healthz
          SMOKE_URL=http://localhost:3000 npm run test:smoke
      - name: Container reports healthy and does not run as root
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' bm2q)
            [ "$status" = healthy ] && break
            sleep 1
          done
          echo "health: $status"
          test "$status" = healthy
          uid=$(docker exec bm2q id -u)
          echo "uid: $uid"
          test "$uid" != 0
      - if: failure()
        run: docker logs bm2q || true

  audit:
    name: No critical vulnerability in production dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=critical
